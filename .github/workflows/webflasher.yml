name: Build web flasher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Site version (e.g. v2.1.0); empty = dev-<sha>"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            firmware/.pio
          key: webflasher-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'sim/platformio.ini', 'scripts/setup-firmware-toolchain.sh') }}

      - name: Set up toolchain
        run: ./init.sh

      - name: Build native-USB firmware
        run: |
          ./tools/pio run -d firmware -e esp32-c3-usb-otg
          ./tools/pio run -d firmware -e esp32-s3-usb-otg
          ./tools/pio run -d firmware -e esp32-c6-usb-otg

      - name: Merge flash images
        run: |
          ESPTOOL="$GITHUB_WORKSPACE/.toolchain/venv/bin/esptool"
          BOOT_APP0="$GITHUB_WORKSPACE/.toolchain/platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -x "$ESPTOOL"
          test -f "$BOOT_APP0"
          merge() {
            local env="$1" chip="$2" out="$3"
            local build="$GITHUB_WORKSPACE/firmware/.pio/build/$env"
            test -f "$build/bootloader.bin"
            test -f "$build/partitions.bin"
            test -f "$build/firmware.bin"
            "$ESPTOOL" --chip "$chip" merge-bin \
              -o "$out" \
              --flash-mode dio --flash-freq 80m --flash-size 4MB \
              0x0 "$build/bootloader.bin" \
              0x8000 "$build/partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$build/firmware.bin"
          }
          mkdir -p build
          merge esp32-c3-usb-otg esp32c3 build/firmware-merged-c3.bin
          merge esp32-s3-usb-otg esp32s3 build/firmware-merged-s3.bin
          merge esp32-c6-usb-otg esp32c6 build/firmware-merged-c6.bin

      - name: Assemble Pages site
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          python3 scripts/make_webflasher.py \
            --version "$VERSION" \
            --binary c3=build/firmware-merged-c3.bin \
            --binary s3=build/firmware-merged-s3.bin \
            --binary c6=build/firmware-merged-c6.bin \
            --out site
          python3 -m json.tool site/manifest.json >/dev/null
          test -f site/firmware-merged-c3.bin
          test -f site/firmware-merged-s3.bin
          test -f site/firmware-merged-c6.bin
          test -f site/index.html

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: elrs-webflasher-site
          path: site/
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_C3="$GITHUB_WORKSPACE/firmware/.pio/build/esp32-c3-usb-otg"
          BUILD_S3="$GITHUB_WORKSPACE/firmware/.pio/build/esp32-s3-usb-otg"
          BUILD_C6="$GITHUB_WORKSPACE/firmware/.pio/build/esp32-c6-usb-otg"
          gh release upload "${{ github.event.release.tag_name }}" \
            build/firmware-merged-c3.bin \
            build/firmware-merged-s3.bin \
            build/firmware-merged-c6.bin \
            site/SHA256SUMS \
            "$BUILD_C3/firmware.elf" \
            "$BUILD_S3/firmware.elf" \
            "$BUILD_C6/firmware.elf" \
            --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: elrs-webflasher-site
          path: site

      # Pages must be enabled once in repository settings:
      # Settings -> Pages -> Source: GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
