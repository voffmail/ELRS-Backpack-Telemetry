; ELRS ESP-NOW USB dongle — ESP32-C3 / ESP32-S3 firmware
;
; Local toolchain:
;   ./init.sh
;   ./tools/pio run -d firmware -e esp32-c3-usb-otg
;   ./tools/pio run -d firmware -e esp32-s3-usb-otg
;   ./tools/pio run -d firmware -e esp32-c3-usb-otg -t upload --upload-port /dev/ttyACM0
;
; Data and runtime configuration use the native USB CDC port.

[env]
platform = espressif32@6.12.0
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; For bring-up logs on the UART debug port, add:
    ; -DELRS_DEBUG_SERIAL=1

build_unflags =

[env:esp32-c3-usb-otg]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DELRS_LED_PIN=8
    -DELRS_LED_ACTIVE_LOW=1

[env:esp32-s3-usb-otg]
board = esp32-s3-devkitc-1
board_build.partitions = default.csv
board_upload.flash_size = 4MB
build_flags =
    ${env.build_flags}
    ; ESP32-S3-DevKitC-1 v1.1 onboard WS2812.
    ; Override for other boards, e.g. -DELRS_LED_PIN=21 for some Super Mini clones,
    ; or -DELRS_LED_PIN=-1 to disable the status LED.
    -DELRS_LED_PIN=48
    -DELRS_LED_RGB=1
