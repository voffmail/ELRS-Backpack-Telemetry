; ELRS ESP-NOW USB dongle — ESP32-C3 firmware
;
; Local toolchain:
;   ./init.sh
;   ./tools/pio run -d firmware -e esp32-c3-usb
;   ./tools/pio run -d firmware -e esp32-c3-usb -t upload --upload-port /dev/ttyACM0
;
; Data and runtime configuration use the native USB CDC port.

[env:esp32-c3-usb]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; For bring-up logs on the UART debug port, add:
    ; -DELRS_DEBUG_SERIAL=1

build_unflags =
